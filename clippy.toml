# Errors are held, not boxed: the keyring's (oo7's, which carries zbus's) is larger than the
# default 128 bytes, and only ever on a path that failed.
large-error-threshold = 256

# No mutable state is shared: state has one owner, `App`, and everything else reaches it by
# message.
disallowed-types = [
    { path = "std::cell::Cell", reason = "no interior mutability; send the owner a message" },
    { path = "std::cell::RefCell", reason = "no interior mutability; send the owner a message" },
    { path = "std::cell::OnceCell", reason = "no interior mutability" },
    { path = "std::sync::Mutex", reason = "no mutable state shared between threads; send a message" },
    { path = "std::sync::RwLock", reason = "no mutable state shared between threads; send a message" },
    { path = "std::sync::OnceLock", reason = "no global state" },
    { path = "std::sync::LazyLock", reason = "no global state" },
    { path = "std::rc::Rc", reason = "hold, move or borrow it; Slint's own handles are fine" },
    { path = "std::rc::Weak", reason = "hold, move or borrow it" },
    { path = "std::sync::Arc", reason = "hold, move or borrow it" },
    { path = "std::thread::LocalKey", reason = "no thread-local state" },
]
