[package]
name = "edualc"
description = "Native desktop window for Claude Code"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "../../README.md"

[[bin]]
name = "edualc"
path = "src/main.rs"

[dependencies]
edualc-core.workspace = true
async-channel.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
dirs.workspace = true
strum = { version = "0.28", features = ["derive"] }
syntect.workspace = true
two-face.workspace = true

# Slint from the user's fork, its branch `slint/integration-branch`: upstream master (62aa150,
# unreleased) with the pull requests not yet merged, which the branch's `integration.sh` lists, b33p
# pinning the same branch. Unreleased upstream: selecting text in a `StyledText` (`selectable`,
# `has-selection`, `copy()`; slint-ui/slint#13985), which every message, code block and tool output
# here relies on. Of the pull requests: a text changed is shaped again only where it changed
# (#14953), so a code block streaming in costs its new lines, not its length. And edualc's own,
# no pull request (its topic `edualc-text`, from felintusun/slint): a loose Markdown list's text on
# its bullet's line, `line-height-factor` on `StyledText` again, and a `language` property, with
# which Japanese and Chinese text sets a quarter em where ideographs meet Latin letters.
# Go back to crates.io once a release carries them.
# Slint draws everything itself (winit and femtovg): the look is Gruvbox, not the desktop's
# widgets, so Qt would only add a dependency (and, at this revision, garbled italics).
# Its features differ for the browser demo, below.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
slint = { git = "https://github.com/barafael/slint", rev = "9d7cc772c0f48032e077637f1bed18191de5ad12", version = "1.20.0", default-features = false, features = ["std", "compat-1-2", "accessibility", "backend-winit", "renderer-femtovg", "unstable-fontique-012"] }
tracing-subscriber.workspace = true
clap.workspace = true

# The browser demo (`web/`): the window, drawn with WebGL into the page's canvas, with a scripted
# daemon in place of Claude Code. No accessibility: AccessKit has no backend in a browser here.
[target.'cfg(target_arch = "wasm32")'.dependencies]
slint = { git = "https://github.com/barafael/slint", rev = "9d7cc772c0f48032e077637f1bed18191de5ad12", version = "1.20.0", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "unstable-fontique-012"] }
web-time = { version = "1.1", features = ["serde"] }
# What the demo's script says, as Claude Code says it.
base64 = "0.23"
uuid = { version = "1.29", default-features = false, features = ["js"] }
derive_more = { version = "2", features = ["display", "deref"] }

[build-dependencies]
slint-build = { git = "https://github.com/barafael/slint", rev = "9d7cc772c0f48032e077637f1bed18191de5ad12", version = "1.20.0" }
# The icons (Lucide), written out for the UI as `@image-url("@lucide/<name>.svg")`.
lucide-static-svg = "1.72"

[dev-dependencies]
proptest.workspace = true
clap_mangen.workspace = true

[lints]
workspace = true
