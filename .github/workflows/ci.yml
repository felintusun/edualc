name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Actions are pinned to commits (the tag in each comment). Every job only reads the repository.
permissions: {}

# a newer push to the same branch or pull request supersedes a running check
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# The checks run as `just check` runs them locally, in edualc's Arch CI image (ci/Containerfile,
# pinned by digest; `just in-image arch <recipe>` runs one there with podman). The Rust toolchain
# is rust-toolchain.toml's.
jobs:
  lint:
    name: Formatting and lints
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/felintusun/edualc-ci:arch@sha256:5843153cfe96f07d91b1c83b8a60f4780bb351e7cd1ec08852e888c09564c0f1
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the tags, which packaging-check compares with dist/releases.json
          fetch-depth: 0
      - run: git config --system --add safe.directory "$PWD"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: just fmt-check
      - run: just lint
      - run: just lint-wasm
      - run: just packaging-check
      - run: just images-check
      - run: just licences-check

  # On the runner itself, not in a container: the image decoder's tests confine child processes
  # with Landlock and seccomp, which a container's own seccomp profile may refuse.
  test:
    name: Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # fontconfig's headers for Slint's text, and pkg-config to find them
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig-dev pkg-config
      # rust-toolchain.toml's
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The image decoder's tests confine a helper as edualc starts it, with nothing open but the
      # standard streams; it refuses to run with more. A step here inherits one more descriptor,
      # so the tests run with everything past the standard streams closed (as `just test` does).
      - run: >-
          python3 -c 'import os, sys; os.closerange(3, os.sysconf("SC_OPEN_MAX"));
          os.execvp(sys.argv[1], sys.argv[1:])' cargo test --locked

  # The page, bundled as a package holds it. dx isn't in edualc's CI images, so it is installed
  # here (at the version Cargo.lock's dioxus is).
  page:
    name: The page
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml's, with the wasm target
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install --locked dioxus-cli@0.7.10
      - run: dx bundle --locked -p edualc-server --platform web --fullstack --profile web
      - run: test -s target/dx/edualcd/release/web/public/index.html

  # The Android app (edualc-server's `mobile` feature), as phones run it (aarch64). The runner's
  # NDK compiles what is C in it (ring). Built with dx and tried in an emulator by hand (README).
  android:
    name: The Android app
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml's, with Android's target
      - run: |
          rustup toolchain install
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: |
          ndk="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$ndk/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$ndk/llvm-ar"
          cargo clippy --locked --target aarch64-linux-android -p edualc-core -p edualc-server \
            --features edualc-server/mobile -- -D warnings

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/felintusun/edualc-ci:arch@sha256:5843153cfe96f07d91b1c83b8a60f4780bb351e7cd1ec08852e888c09564c0f1
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: just deny

  # RustSec's advisories
  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/felintusun/edualc-ci:arch@sha256:5843153cfe96f07d91b1c83b8a60f4780bb351e7cd1ec08852e888c09564c0f1
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: just audit

  # zizmor audits these workflows, online too with the read-only job token, and annotates pull
  # requests with what it finds.
  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/felintusun/edualc-ci:arch@sha256:5843153cfe96f07d91b1c83b8a60f4780bb351e7cd1ec08852e888c09564c0f1
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: just workflows --format github
