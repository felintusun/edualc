[package]
name = "edualc"
description = "Native desktop window for Claude Code"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[[bin]]
name = "edualc"
path = "src/main.rs"

[dependencies]
edualc-core.workspace = true
async-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
dirs.workspace = true
strum = { version = "0.27", features = ["derive"] }

# Slint at an unreleased commit (2026-10-31): selecting text in a `StyledText` (`selectable`, `has-selection`,
# `copy()`; slint-ui/slint#13985), which every message, code block and tool output here relies
# on, and the Qt backend drawing emoji itself (#14449) are merged but in no release yet (1.18.1 is
# the latest). These are the patches b33p's fork carries. Go back to crates.io once 1.19 is out.
# On top, from the user's fork (its `edualc` branch merges them), kept there for now: a loose
# Markdown list's text on its bullet's line (once slint-ui/slint#14665), `line-height-factor` on
# `StyledText` again (once #14666), and a `language` property, with which Japanese and Chinese
# text sets a quarter em where ideographs meet Latin letters (branch `text-language`).
# Slint draws everything itself (winit and femtovg): the look is Gruvbox, not the desktop's
# widgets, so Qt would only add a dependency (and, at this revision, garbled italics).
# Its features differ for the browser demo, below.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
slint = { git = "https://github.com/felintusun/slint", rev = "37854dae34adb168c5f11c6666a1fc732190a5be", version = "1.19.0", default-features = false, features = ["std", "compat-1-2", "accessibility", "backend-winit", "renderer-femtovg", "unstable-fontique-012"] }
tracing-subscriber.workspace = true
clap.workspace = true

# The browser demo (`web/`): the window, drawn with WebGL into the page's canvas, with a scripted
# daemon in place of Claude Code. No accessibility: AccessKit has no backend in a browser here.
[target.'cfg(target_arch = "wasm32")'.dependencies]
slint = { git = "https://github.com/felintusun/slint", rev = "37854dae34adb168c5f11c6666a1fc732190a5be", version = "1.19.0", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "unstable-fontique-012"] }
web-time = { version = "1.1", features = ["serde"] }
# What the demo's script says, as Claude Code says it.
base64 = "0.23"
uuid = { version = "1.29", default-features = false, features = ["js"] }
derive_more = { version = "2", features = ["display", "deref"] }

[build-dependencies]
slint-build = { git = "https://github.com/felintusun/slint", rev = "37854dae34adb168c5f11c6666a1fc732190a5be", version = "1.19.0" }
# The icons (Lucide), written out for the UI as `@image-url("@lucide/<name>.svg")`.
lucide-static-svg = "1.55"

[dev-dependencies]
proptest.workspace = true
clap_mangen.workspace = true

[lints]
workspace = true
