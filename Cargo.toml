[package]
name = "edualc"
description = "Native desktop window for Claude Code"
version = "0.1.0"
edition = "2024"
# Slint is used under GPL-3.0-only, so a built binary goes out under GPL-3.0.
license = "GPL-3.0-or-later"
repository = "https://github.com/felintusun/edualc"
readme = "README.md"

[[bin]]
name = "edualc"
path = "src/main.rs"

[dependencies]
# Slint at an unreleased commit (2026-10-31): selecting text in a `StyledText` (`selectable`, `has-selection`,
# `copy()`; slint-ui/slint#13985), which every message, code block and tool output here relies
# on, and the Qt backend drawing emoji itself (#14449) are merged but in no release yet (1.18.1 is
# the latest). These are the patches b33p's fork carries. Go back to crates.io once 1.19 is out.
# On top, from the user's fork (its `edualc` branch merges them), kept there for now: a loose
# Markdown list's text on its bullet's line (once slint-ui/slint#14665), `line-height-factor` on
# `StyledText` again (once #14666), and a `language` property, with which Japanese and Chinese
# text sets a quarter em where ideographs meet Latin letters (branch `text-language`).
# Slint draws everything itself (winit and femtovg): the look is Gruvbox, not the desktop's
# widgets, so Qt would only add a dependency (and, at this revision, garbled italics). Its
# features differ for the browser demo, below.
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Splitting assistant text into blocks; the inline Markdown inside them is Slint's to parse.
pulldown-cmark = { version = "0.13", default-features = false }
# Code in colour: bat's grammars (two-face), parsed by syntect with its regex engine in Rust (no
# Oniguruma to build). The colours are the theme's, not syntect's themes.
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
# Line diffs for Edit and Write tool calls.
similar = "3"
dirs = "7"
thiserror = "2"
strum = { version = "0.27", features = ["derive"] }
tracing = "0.1"
jiff = { version = "0.2.38", features = ["serde"] }
# `Instant`, which is std's on Linux and the page's clock in a browser; already built for Slint.
web-time = { version = "1.1", features = ["serde"] }
# Newtypes' `Display`, `From` and `Deref`; already built for Slint.
derive_more = { version = "2", features = ["display", "from", "deref"] }
# Images, decoded in a confined helper (see `decode`): pure-Rust PNG, JPEG, GIF and WebP, whose
# decoders are already built for Slint (through resvg).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Images go to Claude Code base64-encoded; already built for Slint (through resvg).
base64 = "0.23"
# Each `!` command's id, which Claude Code skips repeats by, and each new session's; already
# built for Slint (through AccessKit).
uuid = { version = "1.29", default-features = false, features = ["std", "v4", "serde"] }
# The words of a session's name for other sessions to message it by: curated English adjectives
# and nouns, picked by the session's id (no random generator).
petname = { version = "3.2", default-features = false, features = ["default-words"] }
# An agy session's inbox token, cleared from memory once dropped.
zeroize = "1.9"

# Dependencies for Linux only. The browser demo has no processes, sockets, image decoder or desktop.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
slint = { git = "https://github.com/felintusun/slint", rev = "37854dae34adb168c5f11c6666a1fc732190a5be", version = "1.19.0", default-features = false, features = ["std", "compat-1-2", "accessibility", "backend-winit", "renderer-femtovg", "unstable-fontique-012"] }
# Opens links in the browser.
open = "5"
# The desktop's own folder picker, through its portal on Linux.
rfd = "0.17"
# The command line, derived: `--help`, `--version`, `--model=opus`, checked values. No colour.
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# inotify (noticing files other processes write, instead of polling them) and the daemon's Unix
# socket; already built for winit.
rustix = { version = "1", features = ["fs", "net", "process", "pipe", "event"] }
# The image decoder's confinement (see `decode`): its system calls filtered, and its files
# closed with the kernel's Landlock.
seccompiler = "0.5"
# The system calls that filter names; already built for most dependencies.
libc = "0.2"
landlock = "0.4"
# The daemon's actors (connections, sessions), their channels, its processes and sockets;
# already built for a dependency.
tokio = { version = "1", features = ["rt", "net", "process", "io-util", "io-std", "signal", "sync", "time", "macros"] }
# The messages between the window and its daemon: compact, strictly checked serde.
postcard = { version = "1", default-features = false, features = ["use-std"] }
# An agy session's inbox (see `agy`), as Claude Code's own: its key file is named by the SHA-256
# of the inbox's path, its token is random, and a peer's token is compared in constant time.
sha2 = "0.10"
getrandom = { version = "0.3", features = ["std"] }
subtle = "2.6"

# The browser demo (`web/`): the window, drawn with WebGL into the page's canvas, with a scripted
# daemon in place of Claude Code. No accessibility: AccessKit has no backend in a browser here.
[target.'cfg(target_arch = "wasm32")'.dependencies]
slint = { git = "https://github.com/felintusun/slint", rev = "37854dae34adb168c5f11c6666a1fc732190a5be", version = "1.19.0", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "unstable-fontique-012"] }
# The browser's clock and random numbers, for timestamps and ids.
jiff = { version = "0.2.38", features = ["js"] }
uuid = { version = "1.29", default-features = false, features = ["js"] }

[build-dependencies]
slint-build = { git = "https://github.com/felintusun/slint", rev = "37854dae34adb168c5f11c6666a1fc732190a5be", version = "1.19.0" }
# The icons (Lucide), written out for the UI as `@image-url("@lucide/<name>.svg")`.
lucide-static-svg = "1.55"

[dev-dependencies]
# What a peer sends is fed, at random and shrunk to the smallest failing case, to the parsers
# that take it (the frames, the pasted pieces). Without forking tests into processes of their own.
proptest = { version = "1.12", default-features = false, features = ["std"] }
# The manual page (assets/edualc.1), written by a test from the command line's definition.
clap_mangen = "0.3"

# "deny", not "forbid": Slint's generated code allows `unsafe` for itself, which "forbid" refuses.
[lints.rust]
unsafe_code = "deny"

# Errors are not swallowed, casts don't lose, matches name every variant. Shared mutable state is refused in clippy.toml.
[lints.clippy]
map_err_ignore = "deny"
indexing_slicing = "deny"
fallible_impl_from = "deny"
wildcard_enum_match_arm = "deny"
unneeded_field_pattern = "deny"
fn_params_excessive_bools = "deny"
missing_fields_in_debug = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
unused_result_ok = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"
redundant_clone = "deny"
needless_pass_by_ref_mut = "deny"
needless_pass_by_value = "deny"
items_after_statements = "deny"
manual_assert = "deny"
match_same_arms = "deny"
default_trait_access = "deny"
format_push_string = "deny"
map_unwrap_or = "deny"
ignored_unit_patterns = "deny"
redundant_closure_for_method_calls = "deny"
derive_partial_eq_without_eq = "deny"
bool_to_int_with_if = "deny"
disallowed_types = "deny"

# Thin LTO across crates, in parallel: most of fat LTO's gain, without its serial link of all of
# Slint in one unit, which takes several GB and long minutes (in CI, and in a makepkg on a laptop).
[profile.release]
lto = "thin"
strip = true

# The browser demo (`.github/workflows/pages.yml`): every byte is downloaded before the window
# shows, so it is built for size, whole.
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
# wasm-bindgen reads which wasm features are on from a section stripping removes; it drops the
# names itself (`--remove-name-section`).
strip = false
