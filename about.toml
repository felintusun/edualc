# cargo-about: the report of the licenses edualc's dependencies come under, shipped with every
# package as THIRD_PARTY_LICENSES.md. Keep in step with deny.toml's [licenses] allow list: an
# `OR` expression is reported under the first of its licenses accepted here.
#
#   cargo about generate --workspace --features edualc-server/server about.hbs > THIRD_PARTY_LICENSES.md
#   cargo test -- --ignored add_the_grammars_licenses_to_the_report
#
# The second adds the licenses of the grammars two-face bundles, which cargo-about can't see;
# `cargo test` fails while the report lacks them.

# edualc is Linux-only, as in deny.toml: other platforms' crates in the graph are never built.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
# Dev-dependencies aren't built into the program. Build dependencies stay: the Lucide icons are
# embedded through build.rs.
ignore-dev-dependencies = true

accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  "MPL-2.0",
  "GPL-3.0-or-later",
  "GPL-3.0-only",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
